name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compilar módulos
        run: python -m compileall -q src tests

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Smoke test da CLI
        shell: bash
        run: |
          python caoszero.py demo sandbox_ci
          python caoszero.py organize sandbox_ci --apply --yes --report relatorio-ci.md
          python caoszero.py organize sandbox_ci --json > relatorio-ci.json
          python caoszero.py doctor --json > doctor-ci.json
          test -f relatorio-ci.md

      - name: Guardar relatórios
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            relatorio-ci.md
            relatorio-ci.json
            doctor-ci.json
          if-no-files-found: error
